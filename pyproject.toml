
[project]
name = "ml-mini-project"
version = "0.1.0"
description = "Machine Learning mini-project for the Data Analytics Bootcamp"
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "numpy>=2.0.2",
    "pandas>=2.2.3",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "scikit-learn",
    "joblib",
    "imbalanced-learn>=0.14.2",
]

[tool.uv]
package = false

